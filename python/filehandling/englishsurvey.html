<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Theme park survey-krish 9e</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .options {
            margin: 5px 0 10px;
        }

        .options label {
            display: inline-block;
            margin-right: 10px;
            font-size: 13px;
        }

        button {
            margin-top: 15px;
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ffe9;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>theme park survey</h1>
        <p>please tell us what you’d like in a theme park.</p>

        <form id="surveyForm">
            <label for="age">your age (optional)</label>
            <input type="text" id="age" name="age" placeholder="e.g. 16">

            <label>favorite type of ride</label>
            <div class="options">
                <label><input type="radio" name="ride_type" value="roller coasters"> roller coasters</label>
                <label><input type="radio" name="ride_type" value="water rides"> water rides</label>
                <label><input type="radio" name="ride_type" value="family rides"> family rides</label>
                <label><input type="radio" name="ride_type" value="extreme thrill rides"> extreme thrill rides</label>
            </div>

            <label for="theme">what theme would you like most?</label>
            <select id="theme" name="theme">
                <option value="">select a theme</option>
                <option value="fantasy / magic">fantasy / magic</option>
                <option value="space / sci‑fi">space / sci‑fi</option>
                <option value="adventure / jungle">adventure / jungle</option>
                <option value="horror / haunted">horror / haunted</option>
                <option value="cartoon / movies">cartoon / movies</option>
            </select>

            <label>most important things in a theme park</label>
            <div class="options">
                <label><input type="checkbox" name="important" value="safety"> safety</label>
                <label><input type="checkbox" name="important" value="good food"> good food</label>
                <label><input type="checkbox" name="important" value="affordable tickets"> affordable tickets</label>
                <label><input type="checkbox" name="important" value="clean and tidy"> clean and tidy</label>
                <label><input type="checkbox" name="important" value="shows & events"> shows & events</label>
            </div>

            <label for="wish">describe your dream theme park</label>
            <textarea id="wish" name="wish" placeholder="write a few lines..."></textarea>

            <button type="submit">submit</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById("surveyForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const age = document.getElementById("age").value;
            const ride = document.querySelector("input[name='ride_type']:checked")?.value || "none selected";
            const theme = document.getElementById("theme").value || "none selected";

            const important = [...document.querySelectorAll("input[name='important']:checked")]
                .map(i => i.value)
                .join(", ") || "none selected";

            const wish = document.getElementById("wish").value;

            const resultBox = document.getElementById("result");
            resultBox.style.display = "block";
            resultBox.innerHTML = `
                <h3>Your Response:</h3>
                <p><strong>Age:</strong> ${age}</p>
                <p><strong>Favorite Ride:</strong> ${ride}</p>
                <p><strong>Preferred Theme:</strong> ${theme}</p>
                <p><strong>Important Factors:</strong> ${important}</p>
                <p><strong>Your Dream Theme Park:</strong><br>${wish}</p>
            `;
        });
    </script>
</body>

</html>
